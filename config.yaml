# MarketDetective configuration.
# !!!!! Edit this file rather than the code: tickers, benchmarks and parameters.

llm:
  provider: ollama
  model: qwen3:8b
  base_url: http://localhost:11434
  temperature: 0.0

# Stocks to analyse. For each one: the market index and the sector ETF to compare it against.
tickers:
  NVDA:
    name: NVIDIA
    market: SPY            # S&P 500
    sector: SOXX           # semiconductors
  # To add a stock, for example Apple:
  # AAPL:
  #   name: Apple
  #   market: SPY
  #   sector: XLK          # technology

data:
  start: "2018-01-01"
  cache_dir: data/prices

# Event study parameters, in trading days.
event_study:
  estimation_window: 120   # days used to estimate alpha and beta
  gap: 10                  # days left out between the estimation window and the event
  event_window: [-1, 1]    # from the day before to the day after the event
  vol_window: 20           # window for the rolling volatility
  z_threshold: 2.0         # |t| above which a move counts as anomalous

# News: downloaded from Finnhub and stored in a local archive.
# The API key does NOT go here: it is read from the FINNHUB_API_KEY environment variable.
news:
  archive_dir: data/news
  days_before: 3           # download news from 3 days before the event...
  days_after: 2            # ...up to 2 days after, which helps a human establish the cause.
                           #    The RAG only ever shows the model items published before the close.

# RAG: embeddings computed locally through Ollama.
rag:
  embedding_model: nomic-embed-text
  top_k: 5
